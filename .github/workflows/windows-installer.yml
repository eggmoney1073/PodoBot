name: Build PodoBot Setup

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Inject CHZZK credentials
        shell: pwsh
        env:
          CHZZK_CLIENT_ID: ${{ secrets.CHZZK_CLIENT_ID }}
          CHZZK_CLIENT_SECRET: ${{ secrets.CHZZK_CLIENT_SECRET }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CHZZK_CLIENT_ID)) {
            throw "GitHub Secret CHZZK_CLIENT_ID is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:CHZZK_CLIENT_SECRET)) {
            throw "GitHub Secret CHZZK_CLIENT_SECRET is missing."
          }

          function Escape-CSharp([string]$value) {
            return $value.Replace('\', '\\').Replace('"', '\"')
          }

          $clientId = Escape-CSharp $env:CHZZK_CLIENT_ID
          $clientSecret = Escape-CSharp $env:CHZZK_CLIENT_SECRET

          @"
          namespace PodoBot;

          internal static class EmbeddedChzzkConfig
          {
              public const string ClientId = "$clientId";
              public const string ClientSecret = "$clientSecret";
              public const string RedirectUri = "http://localhost:18766/auth/callback";
              public static bool IsConfigured => true;
          }
          "@ | Set-Content -Encoding UTF8 "src/PodoBot/EmbeddedChzzkConfig.cs"

      - name: Restore for Windows x64
        run: dotnet restore src/PodoBot/PodoBot.csproj -r win-x64

      - name: Publish PodoBot
        shell: pwsh
        run: |
          dotnet publish src/PodoBot/PodoBot.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            --no-restore `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o publish

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Get-ChildItem `
            "C:\Program Files (x86)\Inno Setup *\ISCC.exe" `
            -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (-not $iscc) {
            throw "Inno Setup compiler was not found."
          }

          Push-Location installer
          & $iscc.FullName "/DMyAppVersion=0.3.0" "PodoBot.iss"
          Pop-Location

      - name: Upload PodoBotSetup
        uses: actions/upload-artifact@v4
        with:
          name: PodoBotSetup
          path: installer/output/PodoBotSetup.exe
          if-no-files-found: error
